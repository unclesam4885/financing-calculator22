/* =========================================================

========================================================= */

const periods = [30, 60, 90, 120, 150, 180];

const tables = {
  LC: [
    [.018,.036,.048,.060,.066,.078,.108,0],
    [.036,.072,.096,.114,.138,.156,.216,0],
    [.042,.084,.108,.132,.162,.186,.252,0],

    [.114,.228,.300,.366,.438,.504,.684,.912],

  ]
};

/* =========================================================
   공통 함수
========================================================= */

const $ = id => document.getElementById(id);
const form = $("form");

const numericFields = [
  "buy",
  "sell",
  "qty",
  "targetRate",
  "margin",
  "sellDays",
  "buyDays",
  "negoDay",
  "discount",
  "interest",
  "burdenInterest",
  "opening",
  "other",
  "loss",
  "underwriter"
];

const fmt = value => {
  const normalized = Math.abs(value) < 0.00000001 ? 0 : value;
  return normalized.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
};

const clean = value => {
  if (Math.abs(value) < 0.00000001) return "0";
  return String(Number(value.toFixed(10)));
};

let latest = null;

function readValues() {
  const v = {};

  numericFields.forEach(id => {
    const raw = $(id).value;
    v[id] = raw === "" ? NaN : Number(raw);
  });

  [
    "trade",
    "country",
    "method",
    "purchaseMethod",
    "buyerGrade"
  ].forEach(id => {
    v[id] = $(id).value;
  });

  ["nego", "risk", "small"].forEach(id => {
    v[id] = $(id).checked;
  });

  v.countryRecord = countries.find(
    country => country.name === v.country
  );

  return v;
}

/* =========================================================
   계산 엔진
   모든 금액: USD/톤
   totalCost만 거래 전체 USD
========================================================= */

function calculate(v, saleOverride) {
  const sell = saleOverride === undefined
    ? v.sell
    : saleOverride;

  if (!v.countryRecord) {
    throw new Error(
      "국가 목록에서 정확한 판매 국가명을 선택해 주세요."
    );
  }

  const activeNumbers = [
    v.buy,
    sell,
    v.qty,
    v.sellDays,
    v.buyDays,
    v.other,
    v.loss,
    v.underwriter,
    v.interest,
    v.burdenInterest
  ];

  if (v.nego) {
    activeNumbers.push(v.negoDay, v.discount);
  }

  if (v.purchaseMethod === "LC") {
    activeNumbers.push(v.opening);
  }

  if (activeNumbers.some(value => !Number.isFinite(value))) {
    throw new Error(
      "필수 숫자 항목을 모두 입력해 주세요."
    );
  }

  if (sell <= 0 || v.buy < 0 || v.qty <= 0) {
    throw new Error(
      "판매단가와 수량은 0보다 커야 하며 구매단가는 음수일 수 없습니다."
    );
  }

  if (
    [
      v.buyDays,
      v.other,
      v.interest,
      v.burdenInterest
    ].some(value => value < 0) ||
    v.loss < -100 ||
    v.underwriter < 0 ||
    (
      v.nego &&
      (v.discount < 0 || v.negoDay < 0)
    ) ||
    (
      v.purchaseMethod === "LC" &&
      v.opening < 0
    )
  ) {
    throw new Error(
      "기간·요율·비용의 입력 범위를 확인해 주세요."
    );
  }

  if (v.nego && v.negoDay > v.sellDays) {
    throw new Error(
      "네고대금 수령일은 판매 만기일 이내여야 합니다."
    );
  }

  const row = periods.indexOf(v.sellDays);

  const col = v.method === "LC"
    ? v.countryRecord.grade - 1
    : "ABCDEFGR".indexOf(v.buyerGrade);

  if (
    row < 0 ||
    col < 0 ||
    col > 7 ||
    (v.method === "LC" && col === 7)
  ) {
    throw new Error(
      "첨부 보험요율표에서 확인할 수 없는 조건입니다."
    );
  }

  // 보험료: 기간별 기본요율에 할증·할인 계수를 곱합니다.
  const baseRate = tables[v.method][row][col];

  const factors = [
    1 + v.loss / 100,
    1 + v.underwriter / 100,
    v.risk ? 1.25 : 1,
    v.small && v.method === "LC" ? 1.25 : 1,
    v.trade === "triangle" ? 1.4 : 1
  ];

  const insuranceRate = factors.reduce(
    (rate, factor) => rate * factor,
    baseRate
  );

  const insurance = sell * insuranceRate / 100;

  // 환가료: 연율 × 실제 할인기간 / 365
  const discountDays = v.nego
    ? v.sellDays - v.negoDay
    : 0;

  const discount = v.nego
    ? sell * (v.discount / 100) * discountDays / 365
    : 0;

  // 실제 판매대금 수령일
  const receiptDay = v.nego
    ? v.negoDay
    : v.sellDays;

  // 양수: 판매대금 먼저 수령 → 기여이자
  // 음수: 구매대금 먼저 지급 → 부담이자
  const gap = v.buyDays - receiptDay;

  const interestBase = gap >= 0
    ? (v.nego ? sell - discount : sell)
    : v.buy;

  const appliedInterestRate = gap >= 0
    ? v.interest
    : v.burdenInterest;

  if (gap >= 0 && interestBase < 0) {
    throw new Error(
      "할인 후 실수령액이 음수입니다. 환가료율과 기간을 확인해 주세요."
    );
  }

  // 기여·부담이자: 연율 × 해당 기간 / 360
  const signedInterest =
    interestBase *
    (appliedInterestRate / 100) *
    gap / 360;

  /*
    LC 개설수수료 수정 반영
    A/S: buyDays = 0
    A/S ~ LC 30: 최소 30일 적용
    LC 30 초과: 구매 Usance 일수 적용
  */
  const openingDays = v.purchaseMethod === "LC"
    ? Math.max(30, v.buyDays)
    : 0;

  const opening = v.purchaseMethod === "LC"
    ? v.buy * (v.opening / 100) * openingDays / 365
    : 0;

  // 실제 비용에 우리 마진을 더하지 않습니다.
  const cost =
    insurance +
    discount +
    opening +
    v.other -
    signedInterest;

  // 금융비용 차감 후 실제 우리 마진
  const netMargin = sell - v.buy - cost;

  const costRate = v.buy > 0
    ? cost / v.buy * 100
    : null;

  return {
    sell,
    baseRate,
    factors,
    insuranceRate,
    insurance,
    discountDays,
    discount,
    receiptDay,
    gap,
    interestBase,
    appliedInterestRate,
    signedInterest,
    openingDays,
    opening,
    cost,
    netMargin,
    costRate,
    totalCost: cost * v.qty
  };
}

/* =========================================================
   우리 마진 입력 → 판매단가 역산
   판매단가에 따라 변하는 금융비용까지 반영합니다.
========================================================= */

function saleForMargin(v, desiredMargin) {
  if (!Number.isFinite(desiredMargin)) {
    throw new Error("우리 마진을 입력해 주세요.");
  }

  const anchor = Math.max(v.buy, 1);
  const costA = calculate(v, anchor).cost;
  const costB = calculate(v, anchor + 1).cost;

  const slope = costB - costA;
  const denominator = 1 - slope;

  if (Math.abs(denominator) < 0.0000000001) {
    throw new Error(
      "현재 비용 조건으로는 마진을 역산할 수 없습니다."
    );
  }

  const sale = (
    v.buy +
    desiredMargin +
    costA -
    slope * anchor
  ) / denominator;

  if (!Number.isFinite(sale) || sale <= 0) {
    throw new Error(
      "입력한 마진으로 유효한 판매단가를 산정할 수 없습니다."
    );
  }

  return sale;
}

/* =========================================================
   입력 상태 및 국가등급 표시
========================================================= */

function updateFieldStates(v) {
  const country = v.countryRecord;
  const lc = v.method === "LC";

  $("countryInfo").textContent = country
    ? (
      `${country.name} · 국가 ${country.grade}등급` +
      ` · 등급 적용일 ${country.date}` +
      (country.watch ? " · 심층감시국" : "")
    )
    : "국가 목록에서 정확한 국가명을 선택해 주세요.";

  $("lcGradeLabel").hidden = !lc;
  $("buyerGradeLabel").hidden = lc;

  $("lcGrade").value = country
    ? `${country.name} · ${country.grade}등급`
    : "국가를 선택해 주세요.";

  $("negoDay").disabled = !v.nego;
  $("discount").disabled = !v.nego;
  $("opening").disabled = v.purchaseMethod !== "LC";
  $("small").disabled = !lc;
}

function clearResults(message) {
  latest = null;
  $("error").textContent = message;

  [
    "perTon",
    "costRate",
    "netMargin",
    "finance",
    "totalCost"
  ].forEach(id => {
    $(id).textContent = "—";
  });

  [
    "marginFormula",
    "rateFormula",
    "totalFormula"
  ].forEach(id => {
    $(id).textContent = "";
  });

  $("breakdown").replaceChildren();
  $("export").disabled = true;
}

/* =========================================================
   상세 비용 표시
========================================================= */

function addCostRow(title, amount, formula, credit) {
  const row = document.createElement("div");
  row.className = "cost";

  const line = document.createElement("div");
  line.className = "line";

  const name = document.createElement("span");
  name.textContent = title;

  const value = document.createElement("strong");
  value.textContent = fmt(amount);

  if (credit) {
    value.className = "credit";
  }

  const explanation = document.createElement("small");
  explanation.textContent = formula;

  line.append(name, value);
  row.append(line, explanation);

  $("breakdown").append(row);
}

function render(v, result) {
  $("error").textContent = "";

  $("perTon").textContent = fmt(result.cost);

  $("costRate").textContent = result.costRate === null
    ? "산정 불가"
    : fmt(result.costRate) + "%";

  $("netMargin").textContent = fmt(result.netMargin);
  $("finance").textContent = fmt(result.cost);

  $("marginFormula").textContent =
    `판매 ${fmt(result.sell)}` +
    ` − 구매 ${fmt(v.buy)}` +
    ` − 실제 비용 ${fmt(result.cost)}` +
    ` = 우리 마진 ${fmt(result.netMargin)} USD/톤`;

  $("rateFormula").textContent = result.costRate === null
    ? "구매단가가 0이므로 비용 요율을 산정할 수 없습니다."
    : (
      `실제 비용 ${fmt(result.cost)}` +
      ` ÷ 구매단가 ${fmt(v.buy)} × 100` +
      ` = ${fmt(result.costRate)}%.` +
      ` 당사 타겟 요율은 비용 요율과 별도입니다.`
    );

  $("breakdown").replaceChildren();

  addCostRow(
    "수출보험료",
    result.insurance,
    `판매단가 ${fmt(result.sell)} × (` +
    `${result.baseRate.toFixed(3)}% × ` +
    `${result.factors.map(clean).join(" × ")})` +
    ` = ${fmt(result.insurance)} USD/톤` +
    ` · 적용 보험요율 ${result.insuranceRate.toFixed(4)}%`
  );

  addCostRow(
    "환가료",
    result.discount,
    v.nego
      ? (
        `${fmt(result.sell)}` +
        ` × ${v.discount}%` +
        ` × ${result.discountDays}일 ÷ 365` +
        ` = ${fmt(result.discount)} USD/톤`
      )
      : "네고 / 할인 미적용"
  );

  if (result.gap >= 0) {
    addCostRow(
      "사내기여이자 (비용 차감)",
      -result.signedInterest,
      `${fmt(result.interestBase)}` +
      ` × ${result.appliedInterestRate}%` +
      ` × ${result.gap}일 ÷ 360` +
      ` = ${fmt(result.signedInterest)} USD/톤`,
      true
    );
  } else {
    addCostRow(
      "사내부담이자",
      -result.signedInterest,
      `구매단가 ${fmt(result.interestBase)}` +
      ` × ${result.appliedInterestRate}%` +
      ` × ${Math.abs(result.gap)}일 ÷ 360` +
      ` = ${fmt(-result.signedInterest)} USD/톤`
    );
  }

  addCostRow(
    "구매 LC 개설수수료",
    result.opening,
    v.purchaseMethod === "LC"
      ? (
        `구매단가 ${fmt(v.buy)}` +
        ` × 연 ${v.opening}%` +
        ` × ${result.openingDays}일 ÷ 365` +
        ` = ${fmt(result.opening)} USD/톤` +
        ` · A/S~30일은 최소 30일 적용`
      )
      : "구매 LC 미사용"
  );

  addCostRow(
    "기타 직접비",
    v.other,
    "사용자 입력 · USD/톤"
  );

  // 전체 거래 총액은 마지막에만 표시합니다.
  $("totalCost").textContent =
    fmt(result.totalCost) + " USD";

  $("totalFormula").textContent =
    `실제 비용 ${fmt(result.cost)} USD/톤` +
    ` × ${v.qty}톤` +
    ` = ${fmt(result.totalCost)} USD.` +
    ` 중간 반올림 없이 계산합니다.`;

  $("export").disabled = false;
}

/* =========================================================
   양방향 연동 및 재계산
========================================================= */

function update(changed) {
  let v = readValues();

  updateFieldStates(v);

  try {
    if (changed === "targetRate" || changed === "buy") {
      if (
        !Number.isFinite(v.buy) ||
        !Number.isFinite(v.targetRate)
      ) {
        throw new Error(
          "구매단가와 당사 타겟 요율을 입력해 주세요."
        );
      }

      $("sell").value = clean(
        v.buy * (1 + v.targetRate / 100)
      );

      v = readValues();
    } else if (changed === "margin") {
      const sale = saleForMargin(v, v.margin);
      $("sell").value = clean(sale);
      v = readValues();
    }

    const result = calculate(v);

    $("margin").value = clean(result.netMargin);

    $("targetRate").value = v.buy > 0
      ? clean((result.sell - v.buy) / v.buy * 100)
      : "";

    latest = { v, result };

    render(v, result);
  } catch (error) {
    clearResults(
      error.message || "계산 조건을 확인해 주세요."
    );
  }
}

/* =========================================================
   입력 항목 설명 업데이트
========================================================= */

function updateOpeningDescription() {
  const input = $("opening");
  const label = input.closest("label");

  if (label) {
    const textNode = Array.from(label.childNodes).find(
      node => node.nodeType === Node.TEXT_NODE &&
        node.textContent.trim()
    );

    if (textNode) {
      textNode.textContent = "구매 LC 개설 수수료율 ";
    }

    const small = label.querySelector("small");

    if (small) {
      small.textContent = "연 % · 최소 30일 / 365";
    }

    if (!$("openingDayNote")) {
      const note = document.createElement("p");
      note.id = "openingDayNote";
      note.className = "help";
      note.textContent =
        "LC A/S는 구매 Usance days에 0을 입력하세요. " +
        "A/S~30일은 30일, 30일 초과는 입력한 일수를 적용합니다.";
      label.after(note);
    }
  }
}

/* =========================================================
   이벤트
========================================================= */

form.addEventListener("submit", event => {
  event.preventDefault();
});

form.addEventListener("input", event => {
  const changed = event.target.id;

  // TT는 기본적으로 할인하지 않고 판매 만기에 수령합니다.
  if (changed === "method") {
    $("nego").checked = $("method").value === "LC";
  }

  // 국가 변경 시 첨부 자료의 심층감시국 여부 반영
  if (changed === "country") {
    const country = countries.find(
      item => item.name === $("country").value
    );

    $("risk").checked = Boolean(
      country && country.watch
    );
  }

  update(changed);
});

$("reset").addEventListener("click", () => {
  form.reset();
  update();
});

/* =========================================================
   국가 검색 목록
========================================================= */

function initializeCountryOptions() {
  $("countries").replaceChildren();

  countries.forEach(country => {
    const option = document.createElement("option");
    option.value = country.name;
    $("countries").append(option);
  });
}

function renderCountries() {
  const query = $("countrySearch").value.trim();

  $("countryRows").replaceChildren();

  countries
    .filter(country => country.name.includes(query))
    .forEach(country => {
      const tr = document.createElement("tr");

      [
        country.name,
        country.grade,
        country.date,
        country.watch ? "심층감시국" : "—"
      ].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value;
        tr.append(td);
      });

      $("countryRows").append(tr);
    });
}

$("countrySearch").addEventListener(
  "input",
  renderCountries
);

/* =========================================================
   보험요율표 표시
========================================================= */

function renderRateTables() {
  $("rateTables").replaceChildren();

  ["LC", "TT"].forEach(method => {
    const heading = document.createElement("h3");

    heading.textContent = method === "LC"
      ? "L/C · 국가등급별 기본요율 (%)"
      : "T/T · D/A, CAD, COD 수입자등급별 기본요율 (%)";

    const wrapper = document.createElement("div");
    wrapper.className = "scroll";

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const header = document.createElement("tr");

    const grades = method === "LC"
      ? [1,2,3,4,5,6,7,8]
      : ["A","B","C","D","E","F","G","R"];

    ["기간 / 일", ...grades].forEach(value => {
      const th = document.createElement("th");
      th.textContent = value;
      header.append(th);
    });

    thead.append(header);
    table.append(thead);

    const tbody = document.createElement("tbody");

    tables[method].forEach((rates, index) => {
      const tr = document.createElement("tr");

      [
        periods[index],
        ...rates.map(rate => rate.toFixed(3))
      ].forEach(value => {
        const td = document.createElement("td");
        td.textContent = value;
        tr.append(td);
      });

      tbody.append(tr);
    });

    table.append(tbody);
    wrapper.append(table);

    $("rateTables").append(heading, wrapper);
  });

  const note = document.createElement("p");
  note.className = "help";
  note.textContent =
    "2026년 1월 기준 보험요율입니다. " +
    "LC 8등급의 0.000 표기는 무료 보험료로 적용하지 않습니다. " +
    "보험료는 기본요율 × 실별 할인·할증 계수 " +
    "× Underwriter 계수 × 비상위험 계수 " +
    "× 소규모 개설은행 계수(LC) × 중계무역 계수로 계산합니다.";

  $("rateTables").append(note);
}

/* =========================================================
   CSV 내보내기
   모든 비용은 USD/톤, 마지막 총 비용만 USD
========================================================= */

$("export").addEventListener("click", () => {
  if (!latest) return;

  const { v, result } = latest;

  const targetRate = v.buy > 0
    ? (result.sell - v.buy) / v.buy * 100
    : "산정 불가";

  const rows = [
    ["항목", "값", "단위"],
    ["판매 국가", v.country, ""],
    ["국가등급", v.countryRecord.grade, ""],
    ["거래 유형", v.trade === "triangle" ? "중계무역" : "직수출", ""],
    ["판매 결제", v.method, ""],
    ["판매 Usance", v.sellDays, "일"],
    ["구매 지급수단", v.purchaseMethod, ""],
    ["구매 Usance", v.buyDays, "일"],
    ["수량", v.qty, "톤"],
    ["구매단가", v.buy, "USD/톤"],
    ["판매단가", result.sell, "USD/톤"],
    ["당사 타겟 요율", targetRate, "%"],
    ["우리 마진 (실제 비용 차감 후)", result.netMargin, "USD/톤"],
    ["판매채권 네고", v.nego ? "적용" : "미적용", ""],
    ["네고대금 수령일", v.nego ? v.negoDay : "", "일"],
    ["환가료율", v.nego ? v.discount : "", "연 %"],
    ["기여이자율", v.interest, "연 %"],
    ["부담이자율", v.burdenInterest, "연 %"],
    ["보험 기본요율", result.baseRate, "%"],
    ["실별 할인 / 할증률", v.loss, "%"],
    ["Underwriter 할증률", v.underwriter, "%"],
    ["비상위험 할증", v.risk ? "적용" : "미적용", ""],
    ["소규모 개설은행 할증", v.small && v.method === "LC" ? "적용" : "미적용", ""],
    ["보험 적용요율", result.insuranceRate, "%"],
    ["수출보험료", result.insurance, "USD/톤"],
    ["환가료", result.discount, "USD/톤"],
    ["사내기여이자", Math.max(result.signedInterest, 0), "USD/톤"],
    ["사내부담이자", Math.max(-result.signedInterest, 0), "USD/톤"],
    ["LC 개설 연 수수료율", v.purchaseMethod === "LC" ? v.opening : "", "연 %"],
    ["LC 개설수수료 적용일수", result.openingDays, "일"],
    ["구매 LC 개설수수료", result.opening, "USD/톤"],
    ["기타 직접비", v.other, "USD/톤"],
    ["실제 톤당 비용", result.cost, "USD/톤"],
    [
      "구매단가 대비 비용 요율",
      result.costRate === null ? "산정 불가" : result.costRate,
      "%"
    ],
    [
      "보험요율 기준",
      "2026년 1월 / 2026.01.15~2027.01.14 선적분",
      ""
    ],
    [
      "국가등급 기준",
      "2026년 7월 / 2026.07.02 자료",
      ""
    ],
    ["최종 총 비용", result.totalCost, "USD"]
  ];

  const csv = "\uFEFF" + rows.map(row =>
    row.map(value =>
      '"' + String(value).replace(/"/g, '""') + '"'
    ).join(",")
  ).join("\r\n");

  const blob = new Blob(
    [csv],
    { type: "text/csv;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "financing-calculation.csv";

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* =========================================================
   초기 실행
========================================================= */

updateOpeningDescription();
initializeCountryOptions();
renderCountries();
renderRateTables();
update();
</script>

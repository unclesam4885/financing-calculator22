<script>
/*
  결과 PNG / PDF 저장 기능
  외부 라이브러리 없이 브라우저 안에서 파일을 만듭니다.
  기존 계산기 스크립트 다음, </body> 바로 위에 추가하세요.
*/
(() => {
  "use strict";

  const csvButton = document.getElementById("export");

  if (!csvButton || document.getElementById("saveResultPNG")) {
    return;
  }

  const buttonArea = document.createElement("div");

  buttonArea.style.cssText =
    "display:grid;" +
    "grid-template-columns:1fr 1fr;" +
    "gap:10px;" +
    "margin-top:12px;";

  const pngButton = document.createElement("button");
  pngButton.id = "saveResultPNG";
  pngButton.type = "button";
  pngButton.textContent = "PNG 이미지 저장";

  const pdfButton = document.createElement("button");
  pdfButton.id = "saveResultPDF";
  pdfButton.type = "button";
  pdfButton.textContent = "PDF 파일 저장";

  buttonArea.append(pngButton, pdfButton);
  csvButton.after(buttonArea);

  const description = document.createElement("p");
  description.className = "help";
  description.textContent =
    "현재 계산 결과를 거래 조건·비용 상세와 함께 저장합니다. " +
    "PNG는 이미지 파일, PDF는 한 페이지 보고서로 저장됩니다.";

  buttonArea.after(description);

  let busy = false;

  function syncButtons() {
    const disabled = busy || csvButton.disabled;

    pngButton.disabled = disabled;
    pdfButton.disabled = disabled;
  }

  const observer = new MutationObserver(syncButtons);

  observer.observe(csvButton, {
    attributes: true,
    attributeFilter: ["disabled"]
  });

  syncButtons();

  function numberText(value, digits = 2) {
    const normalized = Math.abs(value) < 0.00000001 ? 0 : value;

    return normalized.toLocaleString("en-US", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
  }

  function rateText(value) {
    return value === null || !Number.isFinite(value)
      ? "산정 불가"
      : numberText(value) + "%";
  }

  function dateText(date) {
    const pad = value => String(value).padStart(2, "0");

    return (
      date.getFullYear() + "-" +
      pad(date.getMonth() + 1) + "-" +
      pad(date.getDate()) + " " +
      pad(date.getHours()) + ":" +
      pad(date.getMinutes())
    );
  }

  function fileName(extension) {
    const date = new Date();
    const pad = value => String(value).padStart(2, "0");

    return (
      "financing-result-" +
      date.getFullYear() +
      pad(date.getMonth() + 1) +
      pad(date.getDate()) + "-" +
      pad(date.getHours()) +
      pad(date.getMinutes()) +
      pad(date.getSeconds()) +
      "." + extension
    );
  }

  function getSnapshot() {
    if (typeof latest === "undefined" || !latest || csvButton.disabled) {
      throw new Error(
        "먼저 유효한 거래 조건을 입력해 계산 결과를 확인해 주세요."
      );
    }

    // 저장 도중 입력이 변경되어도 선택한 시점의 결과를 유지합니다.
    return JSON.parse(JSON.stringify(latest));
  }

  function downloadFile(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = name;

    document.body.append(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  /*
    화면 캡처 대신 저장용 보고서를 그립니다.
    외부 이미지나 폰트를 불러오지 않으므로 별도 서버가 필요 없습니다.
  */
  async function createReportCanvas(snapshot) {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    const { v, result: r } = snapshot;
    const width = 1200;

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = 3600;

    const ctx = canvas.getContext("2d");

    if (!ctx) {
      throw new Error("이 브라우저에서 이미지 생성 기능을 사용할 수 없습니다.");
    }

    const fontFamily =
      '"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif';

    const left = 64;
    const right = width - left;
    const contentWidth = right - left;

    let y = 64;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    function text(value, x, top, options = {}) {
      ctx.font =
        (options.bold ? "700 " : "400 ") +
        (options.size || 25) + "px " + fontFamily;

      ctx.fillStyle = options.color || "#244438";
      ctx.textAlign = options.align || "left";
      ctx.textBaseline = "top";

      ctx.fillText(String(value), x, top);
    }

    function rule(top, color = "#dfe7dd") {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(right, top);
      ctx.stroke();
    }

    function wrappedText(value, x, top, maxWidth, options = {}) {
      const size = options.size || 21;
      const lineHeight = options.lineHeight || size * 1.65;

      ctx.font =
        (options.bold ? "700 " : "400 ") +
        size + "px " + fontFamily;

      const paragraphs = String(value).split("\n");
      let currentY = top;

      for (const paragraph of paragraphs) {
        let line = "";

        for (const character of paragraph) {
          const candidate = line + character;

          if (ctx.measureText(candidate).width > maxWidth && line) {
            text(line, x, currentY, options);
            currentY += lineHeight;
            line = character;
          } else {
            line = candidate;
          }
        }

        if (line) {
          text(line, x, currentY, options);
        }

        currentY += lineHeight;
      }

      return currentY;
    }

    function sectionTitle(title) {
      y += 25;
      text(title, left, y, {
        size: 28,
        bold: true
      });
      y += 49;
    }

    function detailRow(label, value, formula) {
      text(label, left, y, { size: 24 });
      text(value, right, y, {
        size: 25,
        bold: true,
        align: "right"
      });

      y += 36;

      if (formula) {
        y = wrappedText(
          formula,
          left,
          y,
          contentWidth,
          {
            size: 19,
            lineHeight: 30,
            color: "#7a8c74"
          }
        );
      }

      y += 13;
      rule(y);
      y += 19;
    }

    text("TRADE DESK", left, y, {
      size: 20,
      bold: true,
      color: "#6d8b72"
    });

    text(dateText(new Date()), right, y, {
      size: 19,
      align: "right",
      color: "#7a8c74"
    });

    y += 43;

    text("파이낸싱 계산 결과", left, y, {
      size: 43,
      bold: true
    });

    y += 65;

    text("거래 조건 및 수익성 보고서", left, y, {
      size: 23,
      color: "#7a8c74"
    });

    y += 46;
    rule(y);

    sectionTitle("01. 거래 조건");

    const country = v.countryRecord || {};

    const purchaseMethod = v.purchaseMethod === "LC"
      ? "L/C"
      : v.purchaseMethod === "TT"
        ? "T/T"
        : "국내 외상 · 구매승인서";

    const tradeType = v.trade === "triangle"
      ? "중계무역 · 삼국간"
      : "직수출";

    const conditionLines = [
      [
        "판매 국가",
        v.country + " / 국가 " + country.grade + "등급"
      ],
      [
        "거래 유형 / 수량",
        tradeType + " / " + numberText(v.qty) + "톤"
      ],
      [
        "판매 / 구매 조건",
        v.method + " " + v.sellDays + "일 / " +
        purchaseMethod + " " + v.buyDays + "일"
      ],
      [
        "판매 / 구매단가",
        numberText(r.sell) + " / " +
        numberText(v.buy) + " USD/톤"
      ],
      [
        "타겟 요율 / 실제 마진",
        rateText(r.tradeGapRate) + " / " +
        numberText(r.netMargin) + " USD/톤"
      ],
      [
        "네고 / 보험등급",
        (v.nego ? "네고 적용 · 수령일 +" + v.negoDay + "일" : "네고 미적용") +
        " / " +
        (v.method === "LC"
          ? "국가 " + country.grade + "등급"
          : "수입자 " + v.buyerGrade + "등급")
      ]
    ];

    conditionLines.forEach(([label, value]) => {
      text(label, left, y, {
        size: 21,
        color: "#7a8c74"
      });

      y = wrappedText(
        value,
        left + 290,
        y,
        contentWidth - 290,
        {
          size: 23,
          lineHeight: 35
        }
      );

      y += 13;
    });

    y += 12;

    const summaryTop = y;
    const summaryHeight = 460;

    ctx.fillStyle = "#173e32";
    ctx.fillRect(left, summaryTop, contentWidth, summaryHeight);

    text("02. 거래 수익성 요약", left + 28, summaryTop + 25, {
      size: 28,
      bold: true,
      color: "#ffffff"
    });

    const summaryRows = [
      [
        "1. 판구매 갭",
        numberText(r.tradeGap) + " USD/톤",
        rateText(r.tradeGapRate)
      ],
      [
        "2. 예상 톤당 비용",
        numberText(r.cost) + " USD/톤",
        rateText(r.costRate)
      ],
      [
        "3. 예상 톤당 마진",
        numberText(r.netMargin) + " USD/톤",
        rateText(r.marginRate)
      ],
      [
        "4. 총 비용",
        numberText(r.totalCost) + " USD",
        ""
      ],
      [
        "5. 총 마진",
        numberText(r.totalMargin) + " USD",
        ""
      ]
    ];

    let summaryY = summaryTop + 88;

    summaryRows.forEach(([label, value, rate]) => {
      text(label, left + 28, summaryY, {
        size: 24,
        color: "#d2e1cb"
      });

      text(
        value + (rate ? "  /  " + rate : ""),
        right - 28,
        summaryY,
        {
          size: 25,
          bold: true,
          color: "#ffffff",
          align: "right"
        }
      );

      summaryY += 64;
    });

    text(
      "모든 요율은 구매단가 기준 · 총액은 중간 반올림 없이 산정",
      left + 28,
      summaryTop + summaryHeight - 42,
      {
        size: 19,
        color: "#b6c8ad"
      }
    );

    y = summaryTop + summaryHeight + 12;

    sectionTitle("03. 금융비용 상세 · USD/톤");

    detailRow(
      "수출보험료",
      numberText(r.insurance),
      "판매단가 " + numberText(r.sell) +
      " × 적용 보험요율 " +
      numberText(r.insuranceRate, 4) + "%"
    );

    detailRow(
      "환가료",
      numberText(r.discount),
      v.nego
        ? numberText(r.sell) + " × 연 " +
          v.discount + "% × " +
          r.discountDays + "일 / 365"
        : "네고 / 할인 미적용"
    );

    detailRow(
      r.gapDays >= 0
        ? "사내기여이자 (비용 차감)"
        : "사내부담이자",
      numberText(-r.signedInterest),
      numberText(r.interestBase) +
      " × 연 " + r.appliedInterestRate +
      "% × " + Math.abs(r.gapDays) + "일 / 360"
    );

    detailRow(
      "구매 LC 개설수수료",
      numberText(r.opening),
      v.purchaseMethod === "LC"
        ? numberText(v.buy) + " × 연 " +
          v.opening + "% × " +
          r.openingDays + "일 / 365 · 최소 30일"
        : "구매 LC 미사용"
    );

    detailRow(
      "기타 직접비",
      numberText(v.other),
      "사용자 입력 · USD/톤"
    );

    detailRow(
      "실제 톤당 비용 합계",
      numberText(r.cost),
      "우리 마진 = 판구매 갭 " +
      numberText(r.tradeGap) +
      " − 실제 비용 " +
      numberText(r.cost) +
      " = " + numberText(r.netMargin) + " USD/톤"
    );

    sectionTitle("04. 적용 기준 · Remark");

    y = wrappedText(
      "보험요율: 2026년 1월 기준 / 2026.01.15~2027.01.14 선적분\n" +
      "국가등급: 2026년 7월 기준 / 2026.07.02 첨부자료\n" +
      "기본 보험요율 " + numberText(r.baseRate, 3) + "%" +
      " × 적용 계수 " + r.factors.map(value => String(value)).join(" × ") +
      " = 적용요율 " + numberText(r.insuranceRate, 4) + "%\n" +
      "환가료는 365일, 기여·부담이자는 360일 기준입니다.\n" +
      "LC 개설수수료는 A/S~30일까지 최소 30일을 적용합니다.\n" +
      "화면 표시 금액과 실제 총액은 반올림 때문에 소액 차이가 날 수 있습니다.\n" +
      "예상 견적용 계산이며 보험 인수 가능 여부와 최종 요율은 별도 확인하세요.",
      left,
      y,
      contentWidth,
      {
        size: 19,
        lineHeight: 31,
        color: "#7a8c74"
      }
    );

    y += 35;

    const output = document.createElement("canvas");
    output.width = width;
    output.height = Math.ceil(y);

    const outputContext = output.getContext("2d");

    outputContext.fillStyle = "#ffffff";
    outputContext.fillRect(0, 0, output.width, output.height);
    outputContext.drawImage(canvas, 0, 0);

    return output;
  }

  function canvasToPNG(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) {
          resolve(blob);
        } else {
          reject(new Error("PNG 파일을 만들지 못했습니다."));
        }
      }, "image/png");
    });
  }

  /*
    저장용 보고서 이미지를 한 페이지 PDF에 넣습니다.
    PDF는 이미지 기반이므로 PDF 안의 글자 검색은 지원하지 않습니다.
  */
  function canvasToPDF(canvas) {
    const dataURL = canvas.toDataURL("image/jpeg", 0.96);
    const binary = atob(dataURL.split(",")[1]);

    const imageBytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      imageBytes[i] = binary.charCodeAt(i);
    }

    const encoder = new TextEncoder();
    const encode = value => encoder.encode(value);

    const pageWidth = 595.28;
    const pageHeight = 841.89;
    const margin = 24;

    const scale = Math.min(
      (pageWidth - margin * 2) / canvas.width,
      (pageHeight - margin * 2) / canvas.height
    );

    const imageWidth = canvas.width * scale;
    const imageHeight = canvas.height * scale;

    const x = (pageWidth - imageWidth) / 2;
    const y = pageHeight - margin - imageHeight;

    const content = encode(
      "q\n" +
      imageWidth.toFixed(4) + " 0 0 " +
      imageHeight.toFixed(4) + " " +
      x.toFixed(4) + " " +
      y.toFixed(4) + " cm\n" +
      "/Im0 Do\n" +
      "Q\n"
    );

    const parts = [];
    const offsets = [0];
    let length = 0;

    function add(part) {
      const bytes = typeof part === "string" ? encode(part) : part;
      parts.push(bytes);
      length += bytes.length;
    }

    function addObject(id, body) {
      offsets[id] = length;
      add(id + " 0 obj\n");
      add(body);
      add("\nendobj\n");
    }

    add("%PDF-1.4\n");

    addObject(
      1,
      "<< /Type /Catalog /Pages 2 0 R >>"
    );

    addObject(
      2,
      "<< /Type /Pages /Kids [3 0 R] /Count 1 >>"
    );

    addObject(
      3,
      "<< /Type /Page /Parent 2 0 R " +
      "/MediaBox [0 0 " + pageWidth + " " + pageHeight + "] " +
      "/Resources << /XObject << /Im0 4 0 R >> >> " +
      "/Contents 5 0 R >>"
    );

    offsets[4] = length;

    add(
      "4 0 obj\n" +
      "<< /Type /XObject /Subtype /Image " +
      "/Width " + canvas.width + " " +
      "/Height " + canvas.height + " " +
      "/ColorSpace /DeviceRGB " +
      "/BitsPerComponent 8 " +
      "/Filter /DCTDecode " +
      "/Length " + imageBytes.length + " >>\n" +
      "stream\n"
    );

    add(imageBytes);
    add("\nendstream\nendobj\n");

    offsets[5] = length;

    add(
      "5 0 obj\n" +
      "<< /Length " + content.length + " >>\n" +
      "stream\n"
    );

    add(content);
    add("endstream\nendobj\n");

    const xrefOffset = length;

    add("xref\n0 6\n");
    add("0000000000 65535 f \n");

    for (let id = 1; id <= 5; id++) {
      add(
        String(offsets[id]).padStart(10, "0") +
        " 00000 n \n"
      );
    }

    add(
      "trailer\n" +
      "<< /Size 6 /Root 1 0 R >>\n" +
      "startxref\n" +
      xrefOffset + "\n" +
      "%%EOF\n"
    );

    return new Blob(parts, {
      type: "application/pdf"
    });
  }

  async function saveResult(type) {
    if (busy) return;

    try {
      const snapshot = getSnapshot();

      busy = true;
      syncButtons();

      pngButton.textContent = "파일 생성 중…";
      pdfButton.textContent = "파일 생성 중…";

      const canvas = await createReportCanvas(snapshot);

      if (type === "png") {
        const blob = await canvasToPNG(canvas);
        downloadFile(blob, fileName("png"));
      } else {
        const blob = canvasToPDF(canvas);
        downloadFile(blob, fileName("pdf"));
      }
    } catch (error) {
      alert(
        error.message ||
        "파일을 저장하지 못했습니다. 입력값을 확인하고 다시 시도해 주세요."
      );
    } finally {
      busy = false;

      pngButton.textContent = "PNG 이미지 저장";
      pdfButton.textContent = "PDF 파일 저장";

      syncButtons();
    }
  }

  pngButton.addEventListener("click", () => saveResult("png"));
  pdfButton.addEventListener("click", () => saveResult("pdf"));
})();
</script>
